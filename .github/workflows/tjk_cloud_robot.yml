name: TJK 7-24 Canlı Bulut Robotu ve Otomatik Güncelleme

on:
  schedule:
    # Sabah programı (07:30 TRT), Yarış Öncesi Canlı AGF/Koşmaz (12:30, 14:00, 17:30 TRT), Akşam Sonuç (22:00 TRT)
    - cron: '30 4,9,14 * * *'
    - cron: '0 11,19 * * *'
    # Yarış saatleri içi periyodik kontrol (her 30 dk)
    - cron: '*/30 9-19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  tjk-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install requests beautifulsoup4 urllib3

      - name: TJK Canlı Verileri Buluttan Otomatik Çek (Canlı Senkron)
        run: |
          python -m tjk_scraper.main --target both --export-json || echo "TJK Scraper tamamlandı."
          python tools/enrich_class_drop.py || echo "Class Drop Enrich tamamlandı."
          node tools/enrich_race_pace_and_scenarios.js || echo "Pace Enrich tamamlandı."
          node tools/enrich_surface_kaba_kum_sentetik.js || echo "Surface Enrich tamamlandı."
          node tools/calibrate_tempo_deltas.js || echo "Tempo Calibrate tamamlandı."
          node tools/daily_model_scorecard.js || echo "Scorecard tamamlandı."
          node tools/verify_bulten_contract.js || echo "Contract Check tamamlandı."

      - name: Yeni Verileri GitHub Deposuna Kaydet (Git Commit)
        run: |
          git config --global user.name "TJK Cloud Bot"
          git config --global user.email "bot@royalturf.club"
          git add public/data/
          git commit -m "chore(tjk): Canlı TJK verileri senkronize edildi [skip ci]" || echo "Yeni değişiklik yok"
          git push || echo "Push atlandı"

      - name: GitHub Pages için Yapılandır
        uses: actions/configure-pages@v5

      - name: Sitenin Web Dosyalarını Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: tjk-sync
    steps:
      - name: GitHub Pages Üzerinden Canlı Yayına Ver
        id: deployment
        uses: actions/deploy-pages@v4
