name: TJK 7-24 Canlı Bulut Robotu ve Otomatik Güncelleme

on:
  schedule:
    # Sabah 09:00 TRT (06:00 UTC) - Günün Programı & Galopları
    - cron: '0 6 * * *'
    # Yarış Saatlerinde (13:00 - 22:30 TRT / 10:00 - 19:30 UTC): HER 5 DAKİKADA BİR CANLI VERİ ÇEKER
    - cron: '*/5 10-19 * * *'
  workflow_dispatch:      # İstendiğinde GitHub web panelinden tek tıkla anında çalıştırma

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  tjk-sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install requests beautifulsoup4 urllib3

      - name: TJK Canlı Verileri Buluttan Otomatik Çek (5 Dakikalık Canlı Senkron)
        run: |
          python tools/tjk_comprehensive_fetch.py || echo "TJK Fetch tamamlandı."
          node tools/tjk_live_sync.js || echo "TJK Sync tamamlandı."
          node tools/enrich_race_pace_and_scenarios.js || echo "Pace Enrich tamamlandı."

      - name: Yeni Verileri GitHub Deposuna Kaydet (Git Commit)
        run: |
          git config --global user.name "TJK Cloud Bot"
          git config --global user.email "bot@royalturf.club"
          git add public/data/
          git commit -m "chore(tjk): Canlı TJK verileri 5 dakikalık periyotla senkronize edildi [skip ci]" || echo "Yeni değişiklik yok"
          git push || echo "Push atlandı"

      - name: GitHub Pages için Yapılandır
        uses: actions/configure-pages@v4

      - name: Sitenin Web Dosyalarını Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: GitHub Pages Üzerinden Canlı Yayına Ver
        uses: actions/deploy-pages@v4
